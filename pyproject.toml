[project]
name = "agentic-os"
version = "0.1.0"
description = "Local Agent Control Plane for local agent runtimes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
agentd = "agentic_os.daemon:app"
agentctl = "agentic_os.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
