[[agents]]
id = "shell"
label = "Shell Smoke"
command = ["/usr/bin/printf", "%s\\n", "{{message}}"]
cwd_mode = "optional"
stop_policy = "process_group"
health_command = ["/usr/bin/printf", "OK"]
version_command = ["/usr/bin/printf", "1.0.0"]
config_fingerprint_command = ["/usr/bin/printf", "static"]

[[agents]]
id = "claude"
label = "Claude Code"
command = ["claude", "-p", "{{message}}", "--output-format", "text"]
model_arg = ["--model", "{{model}}"]
cwd_mode = "required"
stop_policy = "process_group"
health_command = ["claude", "--version"]
version_command = ["claude", "--version"]
config_fingerprint_command = ["claude", "--version"]
config_path = "~/.claude"
workspace_roots = ["~/bootstrap", "~/work"]
log_paths = ["~/.claude/projects"]
default_provider = "anthropic"

[[agents]]
id = "codex"
label = "Codex"
command = ["codex", "exec", "{{message}}"]
model_arg = ["--model", "{{model}}"]
cwd_mode = "required"
stop_policy = "process_group"
health_command = ["codex", "--version"]
version_command = ["codex", "--version"]
config_fingerprint_command = ["codex", "--version"]
config_path = "~/.codex"
workspace_roots = ["~/bootstrap", "~/work"]
log_paths = ["~/.codex/log"]
default_provider = "openai"

[[agents]]
id = "opencode"
label = "OpenCode"
command = ["opencode", "run", "{{message}}"]
cwd_mode = "required"
stop_policy = "process_group"
health_command = ["opencode", "--version"]
version_command = ["opencode", "--version"]
config_fingerprint_command = ["opencode", "--version"]
config_path = "~/.config/opencode"
workspace_roots = ["~/bootstrap", "~/work"]
log_paths = ["~/.local/share/opencode/log"]
default_provider = "openai"
attach_command = ["opencode", "attach"]

[[agents]]
id = "qwen"
label = "Qwen Code"
command = ["qwen", "{{message}}"]
cwd_mode = "required"
stop_policy = "process_group"
health_command = ["qwen", "--version"]
version_command = ["qwen", "--version"]
config_fingerprint_command = ["qwen", "--version"]
config_path = "~/.qwen"
workspace_roots = ["~/bootstrap", "~/work"]
log_paths = ["~/.qwen/debug"]
default_provider = "qwen"

[[agents]]
id = "openclaw"
label = "OpenClaw"
command = ["openclaw", "agent", "--message", "{{message}}", "--json"]
cwd_mode = "required"
stop_policy = "process_group"
health_command = ["openclaw", "status", "--json"]
version_command = ["openclaw", "--version"]
config_fingerprint_command = ["openclaw", "status", "--json"]
config_path = "~/.openclaw"
workspace_roots = ["~/bootstrap", "~/work"]
log_paths = ["~/.openclaw/logs"]
default_provider = "openai"
attach_command = ["openclaw", "attach"]

[[agents]]
id = "hermes"
label = "Hermes"
command = ["hermes", "chat", "--query", "{{message}}", "--quiet", "--source", "agentic-os"]
cwd_mode = "optional"
stop_policy = "process_group"
health_command = ["hermes", "status"]
version_command = ["hermes", "--version"]
config_fingerprint_command = ["hermes", "status"]
config_path = "~/.hermes"
workspace_roots = ["~/bootstrap", "~/work"]
log_paths = ["~/.hermes/logs"]
default_provider = "openai"
attach_command = ["hermes", "--resume"]

[[agents]]
id = "cursor"
label = "Cursor Agent"
command = ["cursor", "agent", "--print", "--trust", "--output-format", "text", "{{message}}"]
cwd_mode = "required"
stop_policy = "process_group"
health_command = ["cursor", "agent", "-v"]
version_command = ["cursor", "agent", "-v"]
config_fingerprint_command = ["cursor", "agent", "-v"]
config_path = "~/.cursor"
workspace_roots = ["~/bootstrap", "~/work"]
log_paths = ["~/.cursor/projects"]
default_provider = "cursor"
attach_command = ["cursor", "agent", "--resume"]
