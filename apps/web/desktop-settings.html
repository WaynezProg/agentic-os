<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desktop Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1.5rem;
        color: #1a1a1a;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.9rem;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.5rem;
      }
      h2 {
        margin-top: 1.5rem;
        font-size: 1rem;
      }
      button {
        margin-top: 0.75rem;
        margin-right: 0.5rem;
        padding: 0.5rem 1rem;
      }
      #status,
      #devices,
      #token-status {
        margin-top: 0.75rem;
        font-size: 0.85rem;
        color: #444;
        white-space: pre-wrap;
      }
      .device-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.35rem;
      }
      .device-row code {
        flex: 1;
        font-size: 0.8rem;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>agentic-os Desktop</h1>

    <h2>Connection</h2>
    <label>
      Mode
      <select id="connection-mode">
        <option value="local">local</option>
        <option value="remote">remote</option>
      </select>
    </label>

    <h2>Local</h2>
    <label>API URL <input id="api-url" /></label>
    <label>UI URL <input id="ui-url" /></label>

    <h2>Remote Access Adapter</h2>
    <label>Remote gateway <input id="remote-gateway" placeholder="https://example.tailnet.ts.net" /></label>
    <label>Tunnel provider <input id="tunnel-provider" placeholder="tailscale / cloudflare / caddy / …" /></label>
    <label>Event stream URL <input id="event-stream-url" readonly /></label>
    <label>Pairing code (ephemeral) <input id="pairing-code" readonly /></label>
    <label>Device name (this client) <input id="device-name" placeholder="wayne-macbook" /></label>
    <label>Device ID <input id="device-id" readonly /></label>
    <div id="token-status"></div>
    <div id="remote-probe"></div>
    <button id="probe-remote" type="button">Probe remote (/health, /events)</button>
    <button id="start-pairing" type="button">Start pairing</button>
    <button id="complete-pairing" type="button">Complete pairing (this device)</button>
    <button id="refresh-devices" type="button">Refresh devices</button>
    <div id="devices"></div>

    <button id="save">Save</button>
    <div id="status"></div>

    <script type="module">
      const { invoke } = window.__TAURI__.core;

      function deriveEventStreamUrl(remoteGateway) {
        const trimmed = remoteGateway.trim().replace(/\/+$/, "");
        return trimmed ? `${trimmed}/events` : "";
      }

      async function probeRemote() {
        const mode = document.getElementById("connection-mode").value;
        if (mode !== "remote") {
          document.getElementById("remote-probe").textContent = "Remote probe: local mode";
          return;
        }
        try {
          const probe = await invoke("probe_remote_connection");
          document.getElementById("remote-probe").textContent = probe.health_ok && probe.events_ok
            ? `Remote probe: ${probe.detail}`
            : `Remote probe: ${probe.detail} (health=${probe.health_ok}, events=${probe.events_ok})`;
        } catch (error) {
          document.getElementById("remote-probe").textContent = `Remote probe failed: ${error}`;
        }
      }

      async function refreshTokenStatus() {
        const remoteGateway = document.getElementById("remote-gateway").value.trim();
        const deviceId = document.getElementById("device-id").value.trim();
        if (!remoteGateway || !deviceId) {
          document.getElementById("token-status").textContent = "Token: not paired";
          return;
        }
        try {
          const stored = await invoke("remote_token_status", {
            remoteGateway,
            deviceId,
          });
          document.getElementById("token-status").textContent = stored
            ? "Token: stored in Keychain"
            : "Token: not in Keychain";
        } catch (error) {
          document.getElementById("token-status").textContent = String(error);
        }
      }

      async function load() {
        const settings = await invoke("get_desktop_settings");
        document.getElementById("connection-mode").value = settings.connection.mode;
        document.getElementById("api-url").value = settings.local.api_url;
        document.getElementById("ui-url").value = settings.local.ui_url;
        document.getElementById("remote-gateway").value = settings.remote.remote_gateway;
        document.getElementById("tunnel-provider").value = settings.remote.tunnel_provider;
        document.getElementById("event-stream-url").value = deriveEventStreamUrl(
          settings.remote.remote_gateway,
        );
        document.getElementById("device-id").value = settings.remote.device_id;
        await refreshTokenStatus();
        await probeRemote();
      }

      function renderDevices(devices) {
        const container = document.getElementById("devices");
        container.replaceChildren();
        if (!devices.length) {
          container.textContent = "No paired devices.";
          return;
        }
        for (const device of devices) {
          const row = document.createElement("div");
          row.className = "device-row";
          const label = document.createElement("code");
          label.textContent = `${device.device_name} · ${device.device_id}`;
          const revoke = document.createElement("button");
          revoke.type = "button";
          revoke.textContent = "Revoke";
          revoke.addEventListener("click", async () => {
            try {
              await invoke("revoke_remote_device", { deviceId: device.device_id });
              document.getElementById("status").textContent = `Revoked ${device.device_id}`;
              await refreshDevices();
              await load();
            } catch (error) {
              document.getElementById("status").textContent = String(error);
            }
          });
          row.append(label, revoke);
          container.append(row);
        }
      }

      async function refreshDevices() {
        try {
          const raw = await invoke("list_remote_devices");
          const payload = JSON.parse(raw);
          renderDevices(payload.devices || []);
        } catch (error) {
          document.getElementById("devices").textContent = String(error);
        }
      }

      document.getElementById("remote-gateway").addEventListener("input", (event) => {
        document.getElementById("event-stream-url").value = deriveEventStreamUrl(event.target.value);
      });

      document.getElementById("start-pairing").addEventListener("click", async () => {
        try {
          const raw = await invoke("start_remote_pairing");
          const payload = JSON.parse(raw);
          document.getElementById("pairing-code").value = payload.pairing_code;
          document.getElementById("status").textContent = `Pairing code expires at ${payload.expires_at}`;
        } catch (error) {
          document.getElementById("status").textContent = String(error);
        }
      });

      document.getElementById("complete-pairing").addEventListener("click", async () => {
        const pairingCode = document.getElementById("pairing-code").value.trim();
        const deviceName = document.getElementById("device-name").value.trim();
        if (!pairingCode) {
          document.getElementById("status").textContent = "Start pairing first to get a code.";
          return;
        }
        if (!deviceName) {
          document.getElementById("status").textContent = "Device name is required.";
          return;
        }
        try {
          const remoteGateway = document.getElementById("remote-gateway").value.trim();
          if (!remoteGateway) {
            document.getElementById("status").textContent = "Save remote gateway before pairing.";
            return;
          }
          const settings = await invoke("get_desktop_settings");
          settings.remote.remote_gateway = remoteGateway;
          settings.remote.tunnel_provider = document
            .getElementById("tunnel-provider")
            .value.trim();
          await invoke("save_desktop_settings", { settings });
          const raw = await invoke("complete_remote_pairing", {
            pairingCode,
            deviceName,
          });
          const payload = JSON.parse(raw);
          document.getElementById("device-id").value = payload.device_id;
          document.getElementById("pairing-code").value = "";
          document.getElementById("status").textContent =
            `Paired as ${payload.device_id}; token saved to Keychain`;
          await refreshTokenStatus();
          await refreshDevices();
        } catch (error) {
          document.getElementById("status").textContent = String(error);
        }
      });

      document.getElementById("refresh-devices").addEventListener("click", refreshDevices);
      document.getElementById("probe-remote").addEventListener("click", probeRemote);

      document.getElementById("save").addEventListener("click", async () => {
        const settings = await invoke("get_desktop_settings");
        settings.connection.mode = document.getElementById("connection-mode").value;
        settings.local.api_url = document.getElementById("api-url").value;
        settings.local.ui_url = document.getElementById("ui-url").value;
        settings.remote.remote_gateway = document.getElementById("remote-gateway").value.trim();
        settings.remote.tunnel_provider = document.getElementById("tunnel-provider").value.trim();
        settings.remote.device_id = document.getElementById("device-id").value.trim();
        await invoke("save_desktop_settings", { settings });
        document.getElementById("status").textContent =
          "Saved endpoint + device_id only; tokens live in Keychain (P12.5a)";
        await refreshTokenStatus();
      });

      load()
        .then(refreshDevices)
        .catch((error) => {
          document.getElementById("status").textContent = String(error);
        });
    </script>
  </body>
</html>
