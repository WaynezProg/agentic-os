<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desktop Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1.5rem;
        color: #1a1a1a;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.9rem;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.5rem;
      }
      h2 {
        margin-top: 1.5rem;
        font-size: 1rem;
      }
      button {
        margin-top: 0.75rem;
        margin-right: 0.5rem;
        padding: 0.5rem 1rem;
      }
      #status,
      #devices {
        margin-top: 0.75rem;
        font-size: 0.85rem;
        color: #444;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>agentic-os Desktop</h1>

    <h2>Connection</h2>
    <label>
      Mode
      <select id="connection-mode">
        <option value="local">local</option>
        <option value="remote">remote</option>
      </select>
    </label>

    <h2>Local</h2>
    <label>API URL <input id="api-url" /></label>
    <label>UI URL <input id="ui-url" /></label>

    <h2>Remote Access Adapter</h2>
    <label>Remote gateway <input id="remote-gateway" placeholder="https://example.tailnet.ts.net" /></label>
    <label>Tunnel provider <input id="tunnel-provider" placeholder="tailscale / cloudflare / caddy / …" /></label>
    <label>Event stream URL <input id="event-stream-url" readonly /></label>
    <label>Pairing code (ephemeral) <input id="pairing-code" readonly /></label>
    <label>Device ID <input id="device-id" /></label>
    <button id="start-pairing" type="button">Start pairing</button>
    <button id="refresh-devices" type="button">Refresh devices</button>
    <div id="devices"></div>

    <button id="save">Save</button>
    <div id="status"></div>

    <script type="module">
      const { invoke } = window.__TAURI__.core;

      function deriveEventStreamUrl(remoteGateway) {
        const trimmed = remoteGateway.trim().replace(/\/+$/, "");
        return trimmed ? `${trimmed}/events` : "";
      }

      async function load() {
        const settings = await invoke("get_desktop_settings");
        document.getElementById("connection-mode").value = settings.connection.mode;
        document.getElementById("api-url").value = settings.local.api_url;
        document.getElementById("ui-url").value = settings.local.ui_url;
        document.getElementById("remote-gateway").value = settings.remote.remote_gateway;
        document.getElementById("tunnel-provider").value = settings.remote.tunnel_provider;
        document.getElementById("event-stream-url").value = deriveEventStreamUrl(
          settings.remote.remote_gateway,
        );
        document.getElementById("device-id").value = settings.remote.device_id;
      }

      async function refreshDevices() {
        try {
          const raw = await invoke("list_remote_devices");
          const payload = JSON.parse(raw);
          document.getElementById("devices").textContent = JSON.stringify(payload.devices, null, 2);
        } catch (error) {
          document.getElementById("devices").textContent = String(error);
        }
      }

      document.getElementById("remote-gateway").addEventListener("input", (event) => {
        document.getElementById("event-stream-url").value = deriveEventStreamUrl(event.target.value);
      });

      document.getElementById("start-pairing").addEventListener("click", async () => {
        try {
          const raw = await invoke("start_remote_pairing");
          const payload = JSON.parse(raw);
          document.getElementById("pairing-code").value = payload.pairing_code;
          document.getElementById("status").textContent = `Pairing code expires at ${payload.expires_at}`;
        } catch (error) {
          document.getElementById("status").textContent = String(error);
        }
      });

      document.getElementById("refresh-devices").addEventListener("click", refreshDevices);

      document.getElementById("save").addEventListener("click", async () => {
        const settings = await invoke("get_desktop_settings");
        settings.connection.mode = document.getElementById("connection-mode").value;
        settings.local.api_url = document.getElementById("api-url").value;
        settings.local.ui_url = document.getElementById("ui-url").value;
        settings.remote.remote_gateway = document.getElementById("remote-gateway").value.trim();
        settings.remote.tunnel_provider = document.getElementById("tunnel-provider").value.trim();
        settings.remote.device_id = document.getElementById("device-id").value.trim();
        await invoke("save_desktop_settings", { settings });
        document.getElementById("status").textContent =
          "Saved endpoint + device_id only; tokens are not persisted (P12.5 Keychain)";
      });

      load()
        .then(refreshDevices)
        .catch((error) => {
          document.getElementById("status").textContent = String(error);
        });
    </script>
  </body>
</html>
